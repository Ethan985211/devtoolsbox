<script>
// ═══ Theme ═══
const themeKey = 'cpp-practice-theme';
function toggleTheme(){
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme')==='dark';
  html.setAttribute('data-theme', isDark?'light':'dark');
  document.querySelector('.theme-toggle').textContent = isDark?'☀️':'🌙';
  localStorage.setItem(themeKey, isDark?'light':'dark');
}
(function(){
  const saved = localStorage.getItem(themeKey)||'dark';
  document.documentElement.setAttribute('data-theme',saved);
  document.querySelector('.theme-toggle').textContent = saved==='dark'?'🌙':'☀️';
})();

// ═══ Problem Database ═══
const problems = [
  {
    id:1,title:"两数之和",difficulty:"简单",category:"基础算法",
    tags:["哈希表","数组"],time:"O(n)","mem":"O(n)",
    desc:"给定一个整数数组 <code>nums</code> 和一个整数目标值 <code>target</code>，请你在该数组中找出和为目标值的那两个整数，并返回它们的数组下标。你可以假设每种输入只会对应一个答案，且同一个元素不能使用两遍。",
    inputFmt:"第一行输入 n 和 target，第二行输入 n 个整数。",
    outputFmt:"输出两个下标（空格分隔）。",
    sampleIn:"4 9\n2 7 11 15",
    sampleOut:"0 1",
    constraints:"2 ≤ n ≤ 10<sup>4</sup>，-10<sup>9</sup> ≤ nums[i] ≤ 10<sup>9</sup>",
    solution:`#include <bits/stdc++.h>
using namespace std;

int main() {
    int n, target;
    cin >> n >> target;
    vector<int> nums(n);
    for (int i = 0; i < n; i++) cin >> nums[i];

    unordered_map<int, int> mp;
    for (int i = 0; i < n; i++) {
        int complement = target - nums[i];
        if (mp.count(complement)) {
            cout << mp[complement] << " " << i << endl;
            return 0;
        }
        mp[nums[i]] = i;
    }
    return 0;
}`,
    explanation:"<p>核心思路：使用<strong>哈希表</strong>存储已经遍历过的元素及其下标。对于每个元素 nums[i]，计算其补数 complement = target - nums[i]，如果 complement 已存在于哈希表中，说明找到了答案。</p><p>时间复杂度 O(n)，空间复杂度 O(n)。这是传智杯初赛高频考点，哈希表的灵活运用是得分关键。</p>"
  },
  {
    id:2,title:"最大子数组和",difficulty:"简单",category:"动态规划",
    tags:["DP","Kadane算法"],time:"O(n)","mem":"O(1)",
    desc:"给定一个整数数组 nums，找到一个具有最大和的连续子数组（子数组最少包含一个元素），返回其最大和。这是经典的<strong>最大子段和</strong>问题，也是传智杯 DP 入门必刷题。",
    inputFmt:"第一行输入 n，第二行输入 n 个整数。",
    outputFmt:"输出最大子数组和。",
    sampleIn:"9\n-2 1 -3 4 -1 2 1 -5 4",
    sampleOut:"6",
    constraints:"1 ≤ n ≤ 10<sup>5</sup>，-10<sup>4</sup> ≤ nums[i] ≤ 10<sup>4</sup>",
    solution:`#include <bits/stdc++.h>
using namespace std;

int main() {
    int n;
    cin >> n;
    vector<int> nums(n);
    for (int i = 0; i < n; i++) cin >> nums[i];

    int maxSum = nums[0], curSum = nums[0];
    for (int i = 1; i < n; i++) {
        curSum = max(nums[i], curSum + nums[i]);
        maxSum = max(maxSum, curSum);
    }
    cout << maxSum << endl;
    return 0;
}`,
    explanation:"<p>Kadane 算法：定义 dp[i] 表示以 nums[i] 结尾的最大子数组和。状态转移：<code>dp[i] = max(nums[i], dp[i-1] + nums[i])</code>。由于 dp[i] 只依赖 dp[i-1]，可以用滚动变量优化空间到 O(1)。</p><p>关键理解：如果前面的子数组和是负数，它只会拖累当前元素，所以直接舍弃，从当前元素重新开始。</p>"
  },
  {
    id:3,title:"爬楼梯",difficulty:"简单",category:"动态规划",
    tags:["DP","斐波那契","滚动数组"],time:"O(n)","mem":"O(1)",
    desc:"假设你正在爬楼梯，需要 n 阶才能到达楼顶。每次你可以爬 1 或 2 个台阶，问有多少种不同的方法可以爬到楼顶？这是 DP 入门经典题，也是理解<strong>状态转移方程</strong>的绝佳例题。",
    inputFmt:"输入一个整数 n。",
    outputFmt:"输出方法数。结果可能很大，请对 10<sup>9</sup>+7 取模。",
    sampleIn:"4",
    sampleOut:"5",
    constraints:"1 ≤ n ≤ 10<sup>5</sup>",
    solution:`#include <bits/stdc++.h>
using namespace std;
const int MOD = 1e9 + 7;

int main() {
    int n;
    cin >> n;
    if (n <= 2) { cout << n << endl; return 0; }
    long long a = 1, b = 2, c;
    for (int i = 3; i <= n; i++) {
        c = (a + b) % MOD;
        a = b;
        b = c;
    }
    cout << b << endl;
    return 0;
}`,
    explanation:"<p>定义 dp[i] 为爬到第 i 阶的方法数。到达第 i 阶可以从第 i-1 阶走 1 步，或从第 i-2 阶走 2 步，所以 <code>dp[i] = dp[i-1] + dp[i-2]</code>。这本质上是斐波那契数列。</p><p>使用滚动变量优化空间为 O(1)。注意取模防止溢出，传智杯中常见对 1e9+7 取模的题目。</p>"
  },
  {
    id:4,title:"零钱兑换",difficulty:"中等",category:"动态规划",
    tags:["DP","完全背包","最值型"],time:"O(n×amount)","mem":"O(amount)",
    desc:"给定不同面额的硬币 coins 和一个总金额 amount。计算可以凑成总金额所需的最少硬币个数。如果没有任何一种硬币组合能组成总金额，返回 -1。每种硬币的数量是<strong>无限的</strong>（完全背包模型）。",
    inputFmt:"第一行输入 n 和 amount，第二行输入 n 种面额。",
    outputFmt:"输出最少硬币数，无法凑出则输出 -1。",
    sampleIn:"3 11\n1 2 5",
    sampleOut:"3",
    constraints:"1 ≤ n ≤ 12，0 ≤ amount ≤ 10<sup>4</sup>",
    solution:`#include <bits/stdc++.h>
using namespace std;

int main() {
    int n, amount;
    cin >> n >> amount;
    vector<int> coins(n);
    for (int i = 0; i < n; i++) cin >> coins[i];

    vector<int> dp(amount + 1, amount + 1);
    dp[0] = 0;
    for (int i = 1; i <= amount; i++) {
        for (int coin : coins) {
            if (i >= coin) dp[i] = min(dp[i], dp[i - coin] + 1);
        }
    }
    cout << (dp[amount] > amount ? -1 : dp[amount]) << endl;
    return 0;
}`,
    explanation:"<p>完全背包模型：dp[i] 表示凑出金额 i 所需的最少硬币数。初始化 dp[0]=0，其余为无穷大。对于每个金额 i，遍历每种硬币，如果 i ≥ coin，则 <code>dp[i] = min(dp[i], dp[i-coin] + 1)</code>。</p><p>传智杯国赛中 DP 的背包变形题几乎必考，完全背包、01背包、多重背包都要熟练掌握。</p>"
  },
  {
    id:5,title:"最长递增子序列 (LIS)",difficulty:"中等",category:"动态规划",
    tags:["DP","二分","贪心"],time:"O(n log n)","mem":"O(n)",
    desc:"给定一个整数数组 nums，找到其中最长严格递增子序列的长度。子序列不要求连续。这是传智杯进阶 DP 必刷题，需要掌握<strong>O(n log n) 的二分优化解法</strong>。",
    inputFmt:"第一行输入 n，第二行输入 n 个整数。",
    outputFmt:"输出最长递增子序列的长度。",
    sampleIn:"8\n10 9 2 5 3 7 101 18",
    sampleOut:"4",
    constraints:"1 ≤ n ≤ 10<sup>5</sup>",
    solution:`#include <bits/stdc++.h>
using namespace std;

int main() {
    int n;
    cin >> n;
    vector<int> nums(n);
    for (int i = 0; i < n; i++) cin >> nums[i];

    vector<int> tails;
    for (int x : nums) {
        auto it = lower_bound(tails.begin(), tails.end(), x);
        if (it == tails.end()) tails.push_back(x);
        else *it = x;
    }
    cout << tails.size() << endl;
    return 0;
}`,
    explanation:"<p>朴素 DP 是 O(n²)，对于 10⁵ 的数据量会超时。O(n log n) 的贪心+二分法：维护一个 tails 数组，tails[i] 表示长度为 i+1 的递增子序列的最小末尾元素。</p><p>对于每个元素 x，二分查找 tails 中第一个 ≥ x 的位置，如果不存在则追加，否则替换。tails 始终保持有序，最终 tails 的长度就是 LIS 长度。</p>"
  },
  {
    id:6,title:"01背包问题",difficulty:"中等",category:"动态规划",
    tags:["DP","背包","经典"],time:"O(n×W)","mem":"O(W)",
    desc:"有 N 件物品和一个容量为 W 的背包。第 i 件物品的重量是 w[i]，价值是 v[i]。每件物品<strong>只能使用一次</strong>。求解将哪些物品装入背包可使价值总和最大。这是所有背包问题的基础模型。",
    inputFmt:"第一行输入 N 和 W，接下来 N 行每行输入重量和价值。",
    outputFmt:"输出最大总价值。",
    sampleIn:"4 8\n2 3\n3 4\n4 5\n5 6",
    sampleOut:"10",
    constraints:"1 ≤ N ≤ 1000，1 ≤ W ≤ 10000",
    solution:`#include <bits/stdc++.h>
using namespace std;

int main() {
    int N, W;
    cin >> N >> W;
    vector<int> w(N), v(N);
    for (int i = 0; i < N; i++) cin >> w[i] >> v[i];

    vector<int> dp(W + 1, 0);
    for (int i = 0; i < N; i++) {
        for (int j = W; j >= w[i]; j--) {
            dp[j] = max(dp[j], dp[j - w[i]] + v[i]);
        }
    }
    cout << dp[W] << endl;
    return 0;
}`,
    explanation:"<p>01背包核心：dp[j] 表示容量为 j 时的最大价值。内层循环<strong>必须从大到小</strong>反向遍历，确保每件物品只被使用一次。如果正向遍历就变成了完全背包。</p><p>状态转移：<code>dp[j] = max(dp[j], dp[j - w[i]] + v[i])</code>。这是传智杯最常考的 DP 模型，必须熟练到能默写。</p>"
  },
  {
    id:7,title:"合并区间",difficulty:"中等",category:"贪心算法",
    tags:["贪心","排序","区间"],time:"O(n log n)","mem":"O(1)",

int find(int x) {
    return parent[x] == x ? x : parent[x] = find(parent[x]);

void unite(int x, int y) {
    x = find(x); y = find(y);
    if (x == y) return;

const ll MOD = 1e9 + 7;

ll qpow(ll a, ll b) {

    a %= MOD;
    while (b) {
        if (b & 1) res = (res * a) % MOD;
        a = (a * a) % MOD;
        b >>= 1;

    solution:`#include <bits/stdc++.h>
using namespace std;

class LRUCache {
    int cap;
    list<pair<int, int>> cache;
    unordered_map<int, list<pair<int, int>>::iterator> mp;
public:
    LRUCache(int capacity) : cap(capacity) {}

    int get(int key) {
        auto it = mp.find(key);
        if (it == mp.end()) return -1;
        cache.splice(cache.begin(), cache, it->second);
        return it->second->second;
    }

    void put(int key, int value) {
        auto it = mp.find(key);
        if (it != mp.end()) {
            it->second->second = value;
            cache.splice(cache.begin(), cache, it->second);
            return;
        }
        if (cache.size() == cap) {
            mp.erase(cache.back().first);
            cache.pop_back();
        }
        cache.push_front({key, value});
        mp[key] = cache.begin();
    }
};

int main() {
    int cap, op;
    cin >> cap;
    LRUCache lru(cap);
    while (cin >> op && op) {
        if (op == 1) { int k; cin >> k; cout << lru.get(k) << endl; }
        else { int k, v; cin >> k >> v; lru.put(k, v); }
    }
    return 0;
}`,

        <div class="info-item"><div class="info-label">算法分类</div><div class="info-value">${p.category}</div></div>
      </div>
      <div class="card-tags" style="margin-bottom:20px">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>

      <div class="modal-section">
        <h3>题目描述</h3>
        <div class="problem-desc">${p.desc}</div>
      </div>

      <div class="modal-section">
        <h3>输入格式</h3>
        <p class="problem-desc">${p.inputFmt}</p>
      </div>
      <div class="modal-section">
        <h3>输出格式</h3>
        <p class="problem-desc">${p.outputFmt}</p>
      </div>

      <div class="modal-section">
        <h3>输入样例</h3>
        <div class="io-block"><pre>${p.sampleIn}</pre></div>
      </div>
      <div class="modal-section">
        <h3>输出样例</h3>
        <div class="io-block"><pre>${p.sampleOut}</pre></div>
      </div>

      <div class="modal-section">
        <h3>约束条件</h3>
        <p class="problem-desc">${p.constraints}</p>
      </div>

      <div class="modal-section">
        <h3>C++ 题解</h3>
        <div class="code-block">
          <button class="copy-btn" onclick="copyCode(this)">复制代码</button>
          <pre><code class="language-cpp">${escapeHtml(p.solution)}</code></pre>
        </div>
      </div>

      <div class="modal-section">
        <h3>思路解析</h3>
        <div class="explanation">${p.explanation}</div>
      </div>
    </div>`;
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('modalOverlay').scrollTop = 0;
  setTimeout(()=>hljs.highlightAll(),50);
}

function closeModal(e){
  if(e.target===document.getElementById('modalOverlay'))
    document.getElementById('modalOverlay').classList.remove('open');
}

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function copyCode(btn){
  const code = btn.parentElement.querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(()=>{
    btn.textContent='已复制!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='复制代码';btn.classList.remove('copied');},1500);
  });
}

function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'})}

// Init
renderProblems();
document.getElementById('statTotal').textContent = problems.length;
</script>
</body>
</html>
